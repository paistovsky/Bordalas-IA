name: Bordalas IA Ensayo

# EL ENSAYO (27/09/2026)
#
#   Un Pepe ENTERO que lee Biwenger de verdad y NO ESCRIBE NADA. Sirve
#   para probar una rama antes de fusionarla: corre la vuelta completa
#   de produccion con los datos de esa hora y dice que habria hecho.
#
#   QUE NO HACE, A DIFERENCIA DE `bordalas-live.yml`:
#     - No escribe en Biwenger: `BORDALAS_ENSAYO=1` cierra las siete
#       escrituras de `BiwengerWriteClient` (guardia:
#       `test_el_ensayo_no_escribe_v1`). Lo que habria enviado queda en
#       `data/ensayo/escrituras_no_enviadas.jsonl`, dentro del artefacto.
#     - No guarda los libros ni empuja nada a git.
#     - No toca el panel de Cloudflare.
#     - No guarda el estado: RESTAURA el de produccion y lo deja igual.
#
#   LOS INTERRUPTORES SON LOS DE PRODUCCION, leidos del YAML de
#   produccion en cada ensayo (no se copian: una copia se desincroniza).
#   Con `interruptores` se SUMAN otros para probarlos antes de encender.
#
#   CUIDADO CON BIWENGER: cada ensayo hace las mismas peticiones que una
#   vuelta de verdad. Se lanza a mano, no en bucle.

on:
  workflow_dispatch:
    inputs:
      interruptores:
        description: "BORDALAS_* que se suman a los de produccion, separados por espacios"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: bordalas-ensayo
  cancel-in-progress: false

jobs:
  ensayo:
    name: Ensayo de Pepe (sin escribir)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BORDALAS_BID_SALT: ${{ secrets.BORDALAS_BID_SALT }}

      # EL CANDADO. Sin esta linea esto no es un ensayo.
      BORDALAS_ENSAYO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot data/lineup_monitor data/intelligence \
                   data/calendar data/rival_intelligence data/league_center \
                   data/competitive_negotiations data/trading data/ensayo \
                   dashboard/data

      # SOLO RESTAURA. `actions/cache/restore` no guarda al terminar, asi
      # que el ensayo no puede ensuciar el estado de produccion.
      - name: Restore Bordalas state (solo lectura)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/league_center
            data/competitive_negotiations
            data/trading
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-ensayo-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Los interruptores de produccion (y los del ensayo)
        shell: bash
        env:
          EXTRA: ${{ github.event.inputs.interruptores }}
        run: |
          python - <<'PY'
          import os
          from src.analysis.los_interruptores_de_produccion import los_de_produccion
          prod = los_de_produccion()
          if not prod["ok"]:
              raise SystemExit("No se pudieron leer los interruptores de produccion: " + str(prod["reason"]))
          extra = [x for x in os.environ.get("EXTRA", "").split() if x.startswith("BORDALAS_")]
          todos = sorted(set(prod["interruptores"]) | set(extra))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for nombre in todos:
                  if nombre != "BORDALAS_ENSAYO":
                      f.write(f"{nombre}=1\n")
          print("Produccion:", " ".join(prod["interruptores"]))
          print("Sumados en el ensayo:", " ".join(extra) or "(ninguno)")
          PY

      - name: Validate (la verja)
        shell: bash
        run: |
          python scripts/run_validation_gate.py

      - name: Run Bordalas V10 (ENSAYO, sin escribir)
        shell: bash
        run: |
          test "$BORDALAS_ENSAYO" = "1" || (echo "Sin candado no se corre" && exit 1)
          python -m src.v10_full_autonomous_live

      - name: Build telemetry (solo local)
        if: always()
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard || true

      - name: Lo que habria escrito
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo " ESCRITURAS QUE EL ENSAYO NO ENVIO"
          echo "========================================"
          if [ -f data/ensayo/escrituras_no_enviadas.jsonl ]; then
            cat data/ensayo/escrituras_no_enviadas.jsonl
          else
            echo "(ninguna)"
          fi

      - name: Upload ensayo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-ensayo-${{ github.run_id }}
          path: |
            data/ensayo/
            data/autopilot/autopilot_log.jsonl
            data/trading/v10_full_autonomous_status.json
            data/trading/v10_production_status.json
            data/intelligence/
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 7
