name: Bordalas IA Live

# EL SCHEDULE DE GITHUB SE RETIRO EL 12/09/2026
#
#   Y NO POR SIMPLIFICAR: SE SALTABA VUELTAS TODOS LOS DIAS.
#
#       llegaba 30-40 minutos tarde
#       y perdia ciclos enteros
#
#   Los `schedule` de Actions no son una promesa: son una cola de
#   baja prioridad. Con una vuelta por hora, 30-40 minutos tarde
#   no es "un poco tarde" — es que la vuelta de esa hora se
#   solapa con la siguiente o se pierde.
#
#   Si abres este fichero, ves que solo tiene `workflow_dispatch`
#   y piensas "le falta el cron": esto es lo que te falta saber.
#   Se probo, se midio y se quito. QUE NADIE LO VUELVA A PONER
#   SIN SABER POR QUE SE QUITO.
#
#   El latido lo dispara ahora cron-job.org (hora de Madrid), que
#   entra por `workflow_dispatch`:
#
#       :07 cada hora, horas 0-3 y 8-23   latido
#       04:45 y 04:50                     ventana del reset
#       07:15                             tras el reset
#
#   ESO NO SE CONFIGURA AQUI Y EL CODIGO NO PUEDE LEERLO. Lo que
#   el proyecto declara esperar esta en `config/disparos.json`, y
#   lo unico que compara esa declaracion contra la realidad es el
#   aviso de DISPARO FUERA DE HORA de la pantalla. Ver
#   `src/analysis/los_disparos.py`.
#
#   Guardia: `test_el_schedule_de_github_no_vuelve_sin_saber_por_que`.
on:
 workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bordalas-autopilot
  cancel-in-progress: false

jobs:
  live:
    name: Bordalas live controlled cycle
    runs-on: ubuntu-latest

    # EL TOPE NO ES PARA QUE QUEPA UNA VUELTA LENTA (21/09/2026)
    #
    #   Es para que una vuelta COLGADA no se coma el dia. Con
    #   `cancel-in-progress: false`, un job atascado bloquea el
    #   grupo de concurrencia: los disparos siguientes se quedan
    #   en cola y GitHub solo guarda UNO pendiente. Cuanto mas alto
    #   el tope, mas latidos se lleva por delante un cuelgue.
    #
    #   HISTORIA DEL NUMERO:
    #       75   provisional, con la vuelta en 27 min (22/09)
    #      180   de emergencia el 24/09: dos vueltas murieron EN el
    #            tope de 75 (75m15s y 75m38s) porque la vuelta se
    #            habia ido a 78 min
    #       30   HOY, 25/09, con la causa arreglada y MEDIDA en
    #            produccion: las vueltas van a 7m05s - 7m42s.
    #
    #   POR QUE 30 Y NO 75. Con vueltas de 7 minutos, un tope de 75
    #   deja que un cuelgue bloquee DIEZ disparos; 30 deja que
    #   bloquee cuatro, y sigue siendo 4 veces el tiempo que tarda
    #   una vuelta normal. Un tope generoso no protege: esconde.
    #
    #   SI VUELVE A SUBIR DE 30, NO SUBAS EL TOPE: MIRA POR QUE.
    #   El reparto por etapa sale impreso en cada vuelta.
    timeout-minutes: 30

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BORDALAS_BID_SALT: ${{ secrets.BORDALAS_BID_SALT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # INTERRUPTORES ENCENDIDOS
      #
      #   Un interruptor encendido aqui ES ESTADO DE PRODUCCION: la verja
      #   corre dentro de este mismo job y lo ve. El 20/09 se encendio uno
      #   sin comprobarlo antes, quince guardias se pusieron rojas y el
      #   ciclo NO LLEGO A CORRER. Doctrina 104.
      #
      #   ANTES DE ANADIR UNO AQUI, EL PASO 0:
      #     python scripts/run_validation_gate.py --paso-0
      #   Si no da el mismo verde que sin el, NO SE ENCIENDE.
      #   Ver `src/analysis/el_protocolo_de_encendido.py`.
      #
      #   Y LA VERJA SE CORRE CON LOS QUE YA ESTAN ENCENDIDOS. Doctrina
      #   112, del 22/09: UN VERDE EN EL PORTATIL NO ES UN VERDE DE
      #   PRODUCCION. Se empujo con la verja verde en local y CI la tiro,
      #   porque en local no estaba puesto REVENTA_SOLO_SI_JUEGA y aqui si.

      # Encendido 21/09. El marcador ordena las jornadas por la fecha real
      # del tablon, no por el numero de jornada del calendario: "Jornada 6" y
      # "Jornada 6 (aplazada)" compartian hora, el desempate era el round_id,
      # y dos jornadas se restaban contra una foto POSTERIOR.
      # Medido: medibles 4->5, diferencia_media +20,4 -> +3,6, restas con
      # negativos grandes 2->0, cero peticiones nuevas, ninguna decision
      # cambia. Solo toca el marcador: no puede cambiar una compra ni una puja.
      #
      # NO ES TEORICO: el calendario trae Levante-Athletic el 21/10/2026 a
      # las 20:00 como MATCHDAY 6 (aplazado de septiembre). Ese dia habra
      # puntos de la jornada 6 con la jornada 9 ya jugada.
      BORDALAS_JORNADAS_POR_SU_FECHA: "1"

      # Encendido 22/09. NO SE COMPRA PARA REVENDER A QUIEN NO CONSTA QUE
      # VAYA A JUGAR.
      #
      #   No inventa umbral: llama a `roster_fill_veto`, que ya contestaba
      #   esa pregunta para la via de plantilla y a la reventa nunca se le
      #   aplico (doctrina 84). Su corte del 40 % tiene medicion: acierta el
      #   81 %, n=114.
      #
      #   POR QUE, medido sobre los 91 viajes cerrados de Pollo17 y Luismi:
      #       puntuo 2-4 pts/partido   n=25   100 % en verde   ROI + 4,67 %
      #       puntuo 4-6 pts/partido   n=12   100 % en verde   ROI +12,56 %
      #       HABIA PARTIDO Y NO JUGO  n= 6    33 % en verde   ROI - 2,03 %
      #                                       el mercado se movio +0,00 %
      #
      #   Contrafactual sobre nuestra temporada: para 12 de nuestros 24
      #   viajes, que perdieron 475.115 EUR. El resultado pasa de +92.375 a
      #   +567.490. Y para las seis compras del 21/09 (2.566.406 EUR).
      #
      #   Paso 0 hecho: verja 172/172 con el interruptor y sin el, y el
      #   paso 0 con los 22 puestos en verde. Ver `config/paso_0.json`.
      BORDALAS_REVENTA_SOLO_SI_JUEGA: "1"

      # Encendido 24/09. EL ONCE SE BUSCA UNA VEZ, NO NOVECIENTAS.
      #
      #   NO CAMBIA NINGUNA DECISION. Es memoria, no criterio: recuerda la
      #   respuesta de la busqueda del once segun el contenido exacto de lo
      #   que recibe. LA BUSQUEDA EN SI NO SE TOCA.
      #
      #   EL PROBLEMA. La vuelta paso de 27 min (22/09) a 78 (24/09), y dos
      #   murieron en el tope de 75. Medido por el propio ciclo:
      #       1070,75 s   73,8 %   build_global_decision
      #        244,75 s   16,9 %   build_competitive_observer
      #        125,35 s    8,6 %   build_cycle_acquisition_board
      #   Y ese analisis se hace DOS veces (PRE y POST): 18m38s cada uno.
      #
      #   LA CAUSA, medida: `build_lineup` es el 97,8 % de
      #   `build_global_decision`. Se llama 135 VECES por vuelta, y de 963
      #   busquedas del once SOLO 48 SON DISTINTAS. Cada motor -plazo,
      #   solvencia, ventas, liquidez, ofertas- se montaba el once por su
      #   cuenta sin pasarselo a nadie. Y escala con la plantilla: 0,26 s
      #   con 15 fichas, 4,78 s con 21.
      #
      #   LO QUE COSTABA NO ARREGLARLO: con la vuelta a 78 min y el cron
      #   cada hora, GitHub solo guarda UN disparo en cola, asi que se
      #   perdia ~1 latido de cada 4. El 24/09 caducaban 8 publicaciones en
      #   35 min y Pepe solo llega a renovar UNA por vuelta.
      #
      #   RESULTADO EN PRODUCCION (25/09), que supero a la estimacion:
      #       el analisis        1451,53 s  ->  90,41 s   (16 veces mas rapido)
      #       la vuelta entera        78 min  ->  7 min
      #       El once, una vez: 70 busquedas hechas, 847 recordadas,
      #                         0 SIN CLAVE
      #       el XI impreso: LOS MISMOS ONCE que la vuelta anterior, 3-5-2
      #   (La estimacion previa era ~21 min, hecha en laboratorio con una
      #   plantilla de 19 y n=1 por lado. Se quedo corta.)
      #
      #   Verja 184/184 en verde con los interruptores de produccion
      #   puestos. Paso 0 PASADO con los 30. La guardia
      #   `test_el_once_se_busca_una_vez_v1` tiene 10 pruebas y se la vio
      #   ponerse roja rompiendo el modulo de dos maneras distintas.
      #
      #   LO QUE HAY QUE SEGUIR VIGILANDO: la memoria recuerda POR EL
      #   CONTENIDO DE LO QUE RECIBE. Si dos onces distintos dieran la misma
      #   clave, la respuesta seria erronea EN SILENCIO. El aviso es
      #   `0 sin clave` y que el XI impreso no cambie sin motivo.
      BORDALAS_EL_ONCE_UNA_VEZ: "1"

      # Encendido 25/09. EL DEFICIT SE MIDE CONTRA EL PLAZO, NO CONTRA HOY.
      #
      #   LO QUE PASABA. Desde el arreglo del 23/09 el ciclo SABE la fecha y
      #   la imprime, pero la regla que decide no la usaba:
      #
      #     "El reloj de solvencia dice «PUBLICAR» con 7.005.920 EUR de
      #      deficit. No se puja: el plazo, del calendario, es el 09/10 a
      #      las 14:45: quedan 336 h (14,0 dias). Hay tiempo, PERO LA REGLA
      #      DE HOY CIERRA CON CUALQUIER DEFICIT."
      #
      #   O sea: sabia que le quedaban dos semanas y actuaba como si fuera
      #   esta tarde. Con el interruptor, el deficit solo frena a menos de
      #   24 h del plazo.
      #
      #   POR QUE AHORA. Entre la jornada 7 (18/09) y la 8 (09/10) hay 21
      #   dias por el paron de selecciones. Comprobado en las DOS fuentes,
      #   que coinciden al minuto:
      #       nuestro calendario (MARCA+LALIGA)  J8 -> 09/10/2026 21:00
      #       el calendario de Biwenger          J8 -> 9 oct 21:00
      #   El plazo efectivo es el 09/10 a las 14:45 (T-6 h 15 min). El
      #   margen NO se toca: solo cambia si se mira o no.
      #
      #   PASO 0 HECHO: este interruptor ya estaba en los 29 del paso 0 del
      #   23/09 y en los 30 del 24/09, los dos en verde.
      #
      #   LO QUE SE ESPERA, Y LO QUE NO ESTA COMPROBADO:
      #     - SI: desbloquea la subasta, que hoy dice `blocked_by: SOLVENCIA`
      #       con 14 dias por delante.
      #     - NO COMPROBADO: si ademas libera la reserva de solvencia sobre
      #       jugadores concretos. Hoy Ceballos -comprado como apuesta de
      #       revalorizacion- sale con `Reserved solvencia: SI`, o sea
      #       marcado para venderse y tapar el agujero que abrio comprarlo.
      #       QUE ESO SE ARREGLE ES UNA INFERENCIA, NO UN DATO. Mirarlo en
      #       la vuelta siguiente.
      #     - Y ojo: encenderlo NO garantiza que puje. Con el saldo en
      #       -7.005.920 y dos pujas del dueno vivas, la puja maxima son
      #       2.208.580.
      BORDALAS_SOLVENCIA_POR_SU_PLAZO: "1"

      # QUITADO 22/09 — BORDALAS_SIN_SUBASTA
      #
      #   Estuvo puesto desde la noche del 21/09 como apagado PROVISIONAL,
      #   para que el reset de las 07:00 no comprase otros cinco suplentes
      #   mientras no hubiera filtro. Ya hay filtro: el de arriba.
      #
      #   Y para que conste, porque su mensaje enganaba: este interruptor
      #   NO cerraba la puerta de fichar. Solo cerraba `plan_del_reset`,
      #   cuyo unico modo es la cesta de reventa. El tablero de fichajes y
      #   el carril siguieron pujando todo el tiempo.
      #
      #   EL CODIGO SIGUE VIVO en `la_subasta.py` (1469, 1477, 1587) y ahi
      #   se queda: es el freno de mano. Lo que se quito fue esta linea.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot
          mkdir -p data/lineup_monitor
          mkdir -p data/intelligence
          mkdir -p data/calendar
          mkdir -p data/rival_intelligence
          mkdir -p data/league_center
          mkdir -p data/competitive_negotiations
          mkdir -p data/trading
          mkdir -p dashboard/data

      - name: Restore Bordalas state
        uses: actions/cache@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/league_center
            data/competitive_negotiations
            data/trading
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BIWENGER_USERNAME" || (echo "Falta BIWENGER_USERNAME" && exit 1)
          test -n "$BIWENGER_PASSWORD" || (echo "Falta BIWENGER_PASSWORD" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Falta API_FOOTBALL_KEY" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate optimized production cycle
        shell: bash
        run: |
          # LA LISTA VIVE EN UN SOLO SITIO (07/09/2026)
          #
          # Aqui habia 66 lineas escritas a mano, una por guardia,
          # y el script de la puerta las leia de este fichero. Cada
          # guardia nueva habia que acordarse de ponerla en los dos
          # sitios, y el dia que se olvidase, CI habria corrido
          # menos que el dueño en local SIN AVISAR DE NADA.
          #
          # Ahora la lista esta en `scripts/run_validation_gate.py`
          # y aqui solo se le llama. El script devuelve != 0 si
          # falla cualquiera, asi que este paso sigue parando el
          # ciclo exactamente igual que antes.
          python scripts/run_validation_gate.py

      - name: Run Bordalas V10 PRODUCTION
        shell: bash
        run: |
          python -m src.v10_full_autonomous_live

      - name: Build Sala de Operaciones telemetry
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard

          echo ""
          echo "========================================"
          echo " BORDALAS IA - DASHBOARD GENERATED"
          echo "========================================"

          test -f data/trading/v10_full_autonomous_status.json
          test -f dashboard/data/status.json
          ls -lh data/trading/v10_full_autonomous_status.json
          ls -lh dashboard/data/status.json
      - name: Update Cloudflare dashboard
        shell: bash
        run: |
          npx --yes wrangler@4.120.1 kv key put \
            "status.json" \
            --path "dashboard/data/status.json" \
            --namespace-id "dbb7542f31b34d8ab0590bf774538b21" \
            --remote

          echo ""
          echo "========================================"
          echo " BORDALAS IA - CLOUDFLARE KV UPDATED"
          echo "========================================"

      # GUARDAR VA ANTES DE PODAR (22/09/2026)
      #
      #   Estos dos pasos estaban al reves, y la consecuencia estaba
      #   escrita en `src/estado/los_libros.py:451`: como se podaba
      #   ANTES de guardar, cualquier libro que quisieramos commitear
      #   se habria guardado YA RECORTADO. Por eso el registro de la
      #   vuelta (`autopilot_log.jsonl`) nunca pudo ir a git, y por eso
      #   hemos tenido que RECONSTRUIR vueltas en vez de leerlas.
      #
      #   Invertidos, se guarda lo que la vuelta escribio y se poda
      #   despues. El cache lo guarda el paso `post` al final del job,
      #   asi que la poda sigue haciendo su trabajo y no se cachea de
      #   mas: solo cambia QUE se commitea.
      #
      #   Esto por si solo no mete el registro en git — hace falta el
      #   cambio de codigo que lo anada a los libros guardados. Lo que
      #   hace es QUITAR EL MOTIVO por el que no se podia.
      - name: Guardar los libros
        if: always()
        shell: bash
        run: |
          git config user.name  "bordalas-ciclo"
          git config user.email "ciclo@bordalas.local"
          python scripts/guardar_los_libros.py --empujar

      - name: Prune persisted state
        if: always()
        shell: bash
        run: |
          python scripts/prune_github_state.py

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-live-diagnostics-${{ github.run_id }}
          path: |
            data/autopilot/autopilot_log.jsonl
            data/lineup_monitor/state.json
            data/calendar/laliga_calendar.json
            data/calendar/calendar_changes.jsonl
            data/intelligence/jornada_perfecta_lineups.json
            data/rival_intelligence/rival_intelligence.json
            data/competitive_negotiations/state.json
            data/trading/position_ledger.json
            data/trading/counteroffer_repricing_state.json
            data/trading/v10_production_status.json
            data/trading/v10_full_autonomous_status.json
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 2
