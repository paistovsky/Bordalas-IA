name: Bordalas IA Live

on:
  workflow_dispatch:

  schedule:
    # Ciclo autonomo principal: dos ejecuciones por hora.
    # El cron-job externo puede permanecer desactivado.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: bordalas-autopilot
  cancel-in-progress: false

jobs:
  live:
    name: Bordalas live controlled cycle
    runs-on: ubuntu-latest
    # Margen de seguridad para un refresco externo lento. El ciclo normal
    # debe terminar muy por debajo de este limite tras reutilizar snapshots.
    timeout-minutes: 20

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot
          mkdir -p data/lineup_monitor
          mkdir -p data/intelligence
          mkdir -p data/calendar
          mkdir -p data/rival_intelligence
          mkdir -p data/league_center
          mkdir -p data/competitive_negotiations
          mkdir -p data/trading
          mkdir -p dashboard/data

      - name: Restore Bordalas state
        uses: actions/cache@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/league_center
            data/competitive_negotiations
            data/trading
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BIWENGER_USERNAME" || (echo "Falta BIWENGER_USERNAME" && exit 1)
          test -n "$BIWENGER_PASSWORD" || (echo "Falta BIWENGER_PASSWORD" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Falta API_FOOTBALL_KEY" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate optimized production cycle
        shell: bash
        run: |
          python -m src.analysis.test_jp_profile_scope_v114
          python -m src.analysis.test_multisource_starter_v1124
          python -m src.analysis.test_v10_full_autonomous_live
          python -m src.analysis.test_live_solvency_authority_v115
          python -m src.telemetry.test_dashboard_execution_v121

          # Candados de la auditoria del 15/08/2026.
          # Deterministas, sin red ni credenciales: si alguien
          # reintroduce una de estas guardias dormidas, el ciclo
          # se detiene aqui y no llega a produccion.
          python -m src.analysis.test_solvency_deadlock_v1
          python -m src.analysis.test_write_path_guards_v1
          python -m src.analysis.test_negotiation_persistence_v1
          python -m src.analysis.test_bid_deduplication_v1
          python -m src.analysis.test_source_accuracy_v1
          python -m src.analysis.test_write_verification_v1
          python -m src.analysis.test_protection_gate_v1
          python -m src.analysis.test_reroll_memory_v1
          python -m src.analysis.test_ledger_dedup_v1
          python -m src.analysis.test_market_clock_v1
          python -m src.analysis.test_position_guardrail_v1
          python -m src.analysis.test_speculation_budget_v1
          python -m src.analysis.test_bid_exposure_v1
          python -m src.analysis.test_bid_targets_v1
          python -m src.analysis.test_external_name_safety_v1
          python -m src.analysis.test_portfolio_budget_v1
          python -m src.analysis.test_roster_plan_guardrail_v1
          python -m src.analysis.test_rival_bid_model_v1
          python -m src.analysis.test_player_value_v1
          python -m src.analysis.test_acquisition_wiring_v1
          python -m src.analysis.test_bid_visibility_v1
          python -m src.analysis.test_dashboard_truth_v1
          python -m src.analysis.test_intocables_v1
          python -m src.analysis.test_calendario_v1
          python -m src.analysis.test_cobrar_ofertas_v1
          python -m src.analysis.test_ciclo_una_sola_vez_v1
          python -m src.analysis.test_escrituras_con_cuerpo_v1
          python -m src.analysis.test_cambiar_titular_v1
          python -m src.analysis.test_suelo_de_titulares_v1
          python -m src.analysis.test_marcador_v1
          python -m src.analysis.test_plantillas_rivales_v1
          python -m src.analysis.test_abono_jornada_v1
          python -m src.analysis.test_mercado_completo_v1
          python -m src.analysis.test_pujar_por_el_xi_v1
          python -m src.analysis.test_once_real_v1
          python -m src.analysis.test_presupuesto_de_fichar_v1
          python -m src.analysis.test_reventa_al_computer_v1
          python -m src.analysis.test_once_de_verdad_v1
          python -m src.analysis.test_correccion_jerarquia_v1
          python -m src.analysis.test_contraoferta_v1
          python -m src.analysis.test_escritura_contada_v1
          python -m src.analysis.test_nombre_corto_v1
          python -m src.analysis.test_action_starvation_v1
          python -m src.analysis.test_price_history_store_v1
          python -m src.analysis.test_futbolfantasy_source_v12
          python -m src.analysis.test_starter_aware_xi_v1
          python -m src.analysis.test_bid_outcome_ledger_v1
          python -m src.analysis.test_etiqueta_vigilar_v1
          python -m src.analysis.test_jornada_del_tablero_v1
          python -m src.analysis.test_plantillas_rivales_llenas_v1
          python -m src.analysis.test_penaltis_apagados_v1
          python -m src.analysis.test_tope_por_operacion_v1
          python -m src.analysis.test_jornada_en_la_valoracion_v1

      - name: Run Bordalas V10 PRODUCTION
        shell: bash
        run: |
          python -m src.v10_full_autonomous_live

      - name: Build Sala de Operaciones telemetry
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard

          echo ""
          echo "========================================"
          echo " BORDALAS IA - DASHBOARD GENERATED"
          echo "========================================"

          test -f data/trading/v10_full_autonomous_status.json
          test -f dashboard/data/status.json
          ls -lh data/trading/v10_full_autonomous_status.json
          ls -lh dashboard/data/status.json
      - name: Update Cloudflare dashboard
        shell: bash
        run: |
          npx --yes wrangler@4.120.1 kv key put \
            "status.json" \
            --path "dashboard/data/status.json" \
            --namespace-id "dbb7542f31b34d8ab0590bf774538b21" \
            --remote

          echo ""
          echo "========================================"
          echo " BORDALAS IA - CLOUDFLARE KV UPDATED"
          echo "========================================"
      - name: Prune persisted state
        if: always()
        shell: bash
        run: |
          python scripts/prune_github_state.py

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-live-diagnostics-${{ github.run_id }}
          path: |
            data/autopilot/autopilot_log.jsonl
            data/lineup_monitor/state.json
            data/calendar/laliga_calendar.json
            data/calendar/calendar_changes.jsonl
            data/intelligence/jornada_perfecta_lineups.json
            data/rival_intelligence/rival_intelligence.json
            data/competitive_negotiations/state.json
            data/trading/position_ledger.json
            data/trading/counteroffer_repricing_state.json
            data/trading/v10_production_status.json
            data/trading/v10_full_autonomous_status.json
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 2
