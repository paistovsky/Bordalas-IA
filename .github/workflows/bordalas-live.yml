name: Bordalas IA Live

# EL SCHEDULE DE GITHUB SE RETIRO EL 12/09/2026
#
#   Y NO POR SIMPLIFICAR: SE SALTABA VUELTAS TODOS LOS DIAS.
#
#       llegaba 30-40 minutos tarde
#       y perdia ciclos enteros
#
#   Los `schedule` de Actions no son una promesa: son una cola de
#   baja prioridad. Con una vuelta por hora, 30-40 minutos tarde
#   no es "un poco tarde" — es que la vuelta de esa hora se
#   solapa con la siguiente o se pierde.
#
#   Si abres este fichero, ves que solo tiene `workflow_dispatch`
#   y piensas "le falta el cron": esto es lo que te falta saber.
#   Se probo, se midio y se quito. QUE NADIE LO VUELVA A PONER
#   SIN SABER POR QUE SE QUITO.
#
#   El latido lo dispara ahora cron-job.org (hora de Madrid), que
#   entra por `workflow_dispatch`:
#
#       :07 cada hora, horas 0-3 y 8-23   latido
#       04:45 y 04:50                     ventana del reset
#       07:15                             tras el reset
#
#   ESO NO SE CONFIGURA AQUI Y EL CODIGO NO PUEDE LEERLO. Lo que
#   el proyecto declara esperar esta en `config/disparos.json`, y
#   lo unico que compara esa declaracion contra la realidad es el
#   aviso de DISPARO FUERA DE HORA de la pantalla. Ver
#   `src/analysis/los_disparos.py`.
#
#   Guardia: `test_el_schedule_de_github_no_vuelve_sin_saber_por_que`.
on:
 workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bordalas-autopilot
  cancel-in-progress: false

jobs:
  live:
    name: Bordalas live controlled cycle
    runs-on: ubuntu-latest

    # EL TOPE NO ES PARA QUE QUEPA UNA VUELTA LENTA (21/09/2026)
    #
    #   Es para que una vuelta COLGADA no se coma el dia. Con
    #   `cancel-in-progress: false`, un job atascado bloquea el
    #   grupo de concurrencia: los disparos siguientes se quedan
    #   en cola y GitHub solo guarda UNO pendiente. Cuanto mas alto
    #   el tope, mas latidos se lleva por delante un cuelgue.
    #
    #   HISTORIA DEL NUMERO:
    #       75   provisional, con la vuelta en 27 min (22/09)
    #      180   de emergencia el 24/09: dos vueltas murieron EN el
    #            tope de 75 (75m15s y 75m38s) porque la vuelta se
    #            habia ido a 78 min
    #       30   HOY, 25/09, con la causa arreglada y MEDIDA en
    #            produccion: las vueltas van a 7m05s - 7m42s.
    #
    #   POR QUE 30 Y NO 75. Con vueltas de 7 minutos, un tope de 75
    #   deja que un cuelgue bloquee DIEZ disparos; 30 deja que
    #   bloquee cuatro, y sigue siendo 4 veces el tiempo que tarda
    #   una vuelta normal. Un tope generoso no protege: esconde.
    #
    #   SI VUELVE A SUBIR DE 30, NO SUBAS EL TOPE: MIRA POR QUE.
    #   El reparto por etapa sale impreso en cada vuelta.
    timeout-minutes: 30

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BORDALAS_BID_SALT: ${{ secrets.BORDALAS_BID_SALT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # INTERRUPTORES ENCENDIDOS
      #
      #   Un interruptor encendido aqui ES ESTADO DE PRODUCCION: la verja
      #   corre dentro de este mismo job y lo ve. El 20/09 se encendio uno
      #   sin comprobarlo antes, quince guardias se pusieron rojas y el
      #   ciclo NO LLEGO A CORRER. Doctrina 104.
      #
      #   ANTES DE ANADIR UNO AQUI, EL PASO 0:
      #     python scripts/run_validation_gate.py --paso-0
      #   Si no da el mismo verde que sin el, NO SE ENCIENDE.
      #   Ver `src/analysis/el_protocolo_de_encendido.py`.
      #
      #   Y LA VERJA SE CORRE CON LOS QUE YA ESTAN ENCENDIDOS. Doctrina
      #   112, del 22/09: UN VERDE EN EL PORTATIL NO ES UN VERDE DE
      #   PRODUCCION. Se empujo con la verja verde en local y CI la tiro,
      #   porque en local no estaba puesto REVENTA_SOLO_SI_JUEGA y aqui si.

      # Encendido 21/09. El marcador ordena las jornadas por la fecha real
      # del tablon, no por el numero de jornada del calendario: "Jornada 6" y
      # "Jornada 6 (aplazada)" compartian hora, el desempate era el round_id,
      # y dos jornadas se restaban contra una foto POSTERIOR.
      # Medido: medibles 4->5, diferencia_media +20,4 -> +3,6, restas con
      # negativos grandes 2->0, cero peticiones nuevas, ninguna decision
      # cambia. Solo toca el marcador: no puede cambiar una compra ni una puja.
      #
      # NO ES TEORICO: el calendario trae Levante-Athletic el 21/10/2026 a
      # las 20:00 como MATCHDAY 6 (aplazado de septiembre). Ese dia habra
      # puntos de la jornada 6 con la jornada 9 ya jugada.
      BORDALAS_JORNADAS_POR_SU_FECHA: "1"

      # Encendido 22/09. NO SE COMPRA PARA REVENDER A QUIEN NO CONSTA QUE
      # VAYA A JUGAR.
      #
      #   No inventa umbral: llama a `roster_fill_veto`, que ya contestaba
      #   esa pregunta para la via de plantilla y a la reventa nunca se le
      #   aplico (doctrina 84). Su corte del 40 % tiene medicion: acierta el
      #   81 %, n=114.
      #
      #   POR QUE, medido sobre los 91 viajes cerrados de Pollo17 y Luismi:
      #       puntuo 2-4 pts/partido   n=25   100 % en verde   ROI + 4,67 %
      #       puntuo 4-6 pts/partido   n=12   100 % en verde   ROI +12,56 %
      #       HABIA PARTIDO Y NO JUGO  n= 6    33 % en verde   ROI - 2,03 %
      #                                       el mercado se movio +0,00 %
      #
      #   Contrafactual sobre nuestra temporada: para 12 de nuestros 24
      #   viajes, que perdieron 475.115 EUR. El resultado pasa de +92.375 a
      #   +567.490. Y para las seis compras del 21/09 (2.566.406 EUR).
      #
      #   Paso 0 hecho: verja 172/172 con el interruptor y sin el, y el
      #   paso 0 con los 22 puestos en verde. Ver `config/paso_0.json`.
      BORDALAS_REVENTA_SOLO_SI_JUEGA: "1"

      # Encendido 27/09 (lo pidio el dueno). LA MISMA REGLA, EN EL CARRIL.
      #
      #   La de arriba solo la mira la subasta del reset. El carril compra
      #   para revender y no la miraba: Trent (-223.500) y Drkusic (-36.376)
      #   entraron por ahi sin pronostico. Con ella, sus 4 viajes salen
      #   +259.876 EUR mejor. En la foto del 18/09 deja pasar 14 de 20.
      #
      #   Paso 0 hecho: verja 190/190 con el y sin el, paso 0 con los 33.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_REVENTA_SOLO_SI_JUEGA_EN_EL_CARRIL: "1"

      # Encendido 28/09 21:30 de Madrid. LA REGLA DE LA RAMPA (E1).
      #
      #   Solo se compra para revender lo que SUBIO en el ultimo cambio de
      #   precio (price_increment > 0), en la subasta del reset y en el
      #   carril. 191 compras reales de la liga: subiendo, 57/73 verdes y
      #   +25,7 M; sin subir, 24/58 y -567.940. Las 34 pujas de reventa de
      #   Pepe hasta hoy fueron todas a precios quietos o bajando.
      #
      #   Verja 194/194 con el y sin el; paso 0 con 35 (config/paso_0.json);
      #   ensayo #3 verde. Si la vuelta siguiente sale roja, se quita esta
      #   linea y ya.
      BORDALAS_COMPRA_SOLO_SI_SUBE: "1"

      # Encendido 28/09 22:40 de Madrid. LA RACHA DIARIA.
      #
      #   250.000 EUR cada cinco dias de entrar, que el dueno cobraba a mano
      #   (Pepe 3 canjes, Pollo17 7). Si la racha que ya lee la vuelta llega
      #   a 5, pide el canje: POST /account/dailyStreak/redeem, el boton de
      #   la app. Si no, nada. No gasta peticiones de mas.
      #
      #   Verja 194/194; paso 0 con 35; ensayo #36468507118 verde (racha 2 ->
      #   AUN_NO_TOCA). Canario de la rampa (#1867) verde antes de esto.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_COBRA_LA_RACHA: "1"

      # Encendido 29/09 de Madrid. LA ORDEN DEL GESTOR.
      #
      #   Ejecuta config/la_orden_del_gestor.json y nada mas: pujar
      #   8.950.000 por Roberto Fernandez (59 pts en 7 jornadas, 8.o de
      #   547), no pujar por Lejeune, y con Roberto dentro vender al
      #   Computer (con suelo) a Jutgla, Antonio Blanco, Maffeo y Zubeldia
      #   para volver a saldo >= 0 antes de la J8. Protege a Yamal y a
      #   Roberto: no se pueden publicar. Caduca el 09/10 15:00.
      #
      #   Verja 196/196; paso 0 con 36; ensayo #36542542273 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_ORDEN_DEL_GESTOR: "1"

      # Encendido 05/10 de Madrid. LOS CHOLLOS DEL PRECIO FIJO (regla del
      #   dueno, caso Moi Gomez; laboratorio E12). Puja valor - 1.000 EUR
      #   por los del Computer que ya valen mas de lo que piden; lo ultimo
      #   del ciclo y solo en la ultima vuelta antes del reset; a menos de
      #   72 h de una jornada, solo con caja propia. Revende en cuanto hay
      #   beneficio. Verja 200/200; paso 0 con 38; ensayo #37375467264 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LOS_CHOLLOS: "1"

      # Encendido 12/10 de Madrid. LA RONDA (regla del dueno: «revision
      #   cada ciclo; se compra, se ejecuta toda la deuda, se aguanta y se
      #   vende mas caro»; laboratorio E1, E3, E9, E28). En CADA vuelta
      #   fuera de la zona de silencio puja precio + 1 % por los del
      #   Computer que suben, sanos y que juegan (3+ partidos, 3+ pts por
      #   partido); hasta 3 M por jugador y hasta maximumBid - 1 M (que ya
      #   descuenta las pujas vivas). No compra a menos de 40 h de la
      #   jornada; vende con beneficio, el primer dia que baja a -2 %, a
      #   36 h a -7 % y a 20 h a lo que ofrezcan. Verja 201/201; paso 0
      #   con 39; ensayo #38245120244 verde (puja Moi Gomez 1.101.000).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_RONDA_DE_LA_MANANA: "1"

      # Encendido 16/10 de Madrid, viernes por la noche, por orden del
      #   dueno («ponlo en marcha ya»: Pollo17 nos gana las pujas y se
      #   distancia en patrimonio). LA PUERTA A PRECIO DE MERCADO: la ronda
      #   tambien puja por los que venden otros managers, solo si piden su
      #   valor (+3 % como mucho), suben y juegan; la puja va a nombre del
      #   vendedor. Verja 209/209 con los de produccion y con el nuevo;
      #   paso 0 con 45; ensayo #38969326126 verde (pujaria por
      #   Freeman 2.012.000 y Alvaro Nunez 1.091.000, a Manzagool).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_PUERTA_A_PRECIO_DE_MERCADO: "1"

      # Encendido 17/10 de Madrid, de madrugada, por orden del dueno («Hazlo
      #   ya. Que se revaloricen, la misma estrategia que ellos»). LA CARTERA
      #   (laboratorio de la noche: +46,1 M de los +50,4 M de Pollo17 son
      #   revalorizacion de lo que compra subiendo y aguanta). La ronda
      #   aguanta lo que sube y lo vende el primer dia que no sube (desde el
      #   97 % del valor); prima por tramo (+12 % <1 M, +4 % 1-3 M) solo a
      #   64 h o mas, en 9.000; max 20 jugadores; EL COLCHON (saldo - pujas
      #   vivas + 0,92 x lo de la ronda >= 0); el motor viejo no vende lo que
      #   aguanta; el cierre en rojo vende la cartera (la alineada, como
      #   ultimo recurso); la mejora cuenta enteras sus pujas. Revisada por 3
      #   lupas y 12 verificaciones. Verja 210/210 con los de produccion y con
      #   el nuevo; paso 0 con 46; ensayo #38974987328 verde (NADA: colchon
      #   agotado con 3 pujas vivas).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_CARTERA: "1"

      # Encendido 17/10 de Madrid (madrugada). LA MEJORA SOLO SI SUBE
      #   (laboratorio de la revalorizacion, verificado): el que no sube hoy
      #   sube manana el 2,4 % y pierde -5,9 % a 7 dias (n=369); la mejora
      #   no miraba el precio (Luismi Cruz, 14/10). Del Computer solo entra
      #   quien sube la minima de su tramo, salvo para tapar un hueco (el
      #   que sale lesionado, sancionado o <50 % titular). Verja 211/211 con
      #   los de produccion y con el nuevo; paso 0 con 47; ensayo
      #   #38985462260 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_MEJORA_SOLO_SI_SUBE: "1"

      # Encendido 17/10 de Madrid. LA PUJA EN 9.900 (laboratorio, paso 3):
      #   la puja de quien entra en el once termina en 9.900 (ninguna de las
      #   186 pujas rivales mas altas acaba entre 9.901 y 9.999; Pollo17
      #   termina en 7.000). Verja 212/212 con los de produccion y con el
      #   nuevo; paso 0 con 48; ensayo #39017130896 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_PUJA_EN_9900: "1"

      # Encendido 17/10 de Madrid. UN SOLO COLCHON (laboratorio de rivales):
      #   el motor viejo pujo 1.778.494 por Manu Sanchez con la caja en
      #   -432.317 (su presupuesto autoriza deuda y no ve la cartera). Con
      #   la cartera, su puja tiene que caber en el colchon de la ronda y
      #   cuenta entera. Verja 215/215 con los de produccion y con el
      #   nuevo; paso 0 con 50; ensayo #39021140487 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_UN_SOLO_COLCHON: "1"

      # Encendido 17/10 de Madrid (noche). LA ROTACION (laboratorio de
      #   rivales): cambia al que lleva 2 dias sin subir por uno de su
      #   posicion que sube y puntua igual o mas; 2 por ventana y semana,
      #   caja de todos los motores, vende al que sale cuando el otro ya
      #   llego, sin hueco en el once ni con la ronda jugandose. Revision
      #   adversarial (22 hallazgos arreglados); verja 217/217 con los de
      #   produccion y con el nuevo; paso 0 con 51; ensayo #39032541463
      #   verde (5 que caen, NADA con la J9 jugandose). No puede pujar
      #   antes del lun 19/10 07:15.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_ROTACION: "1"

      # Encendido 18/10 de Madrid. EL MOTOR VIEJO, SOLO SI SUBE (laboratorio
      #   de rivales): lo que esa rama pujo desde el 21/08 por jugadores que
      #   bajaban el dia de la puja dejo -716.045 (n=3); subiendo, +1,18 M
      #   (n=4). Solo puja por el que sube de verdad (la vara de la mejora).
      #   Solo quita gasto. Revision adversarial (4 arreglados); verja
      #   218/218 con los de produccion y con el nuevo; paso 0 con 52;
      #   ensayo #39112934857 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_EL_MOTOR_VIEJO_SOLO_SI_SUBE: "1"

      # Encendido 18/10 de Madrid (tarde). EL INFORME DE LA MAÑANA (encargo
      #   del dueno): cada dia de mercado, a cada nuevo del mercado le pone
      #   SUBE y PUNTUA con los pesos del laboratorio del 18/10, y lo apunta
      #   en su libro. SOLO OBSERVA: ninguna puja lo lee (fase 2, con su
      #   interruptor, tras medirlo una o dos semanas). Revision adversarial
      #   (12 arreglados); verja 219/219 con los de produccion y con el
      #   nuevo; paso 0 con 53; ensayo #39129474545 verde (20 nuevos;
      #   Carvajal sube 35, puntua 1,3).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_EL_INFORME_DE_LA_MANANA: "1"

      # Encendido 12/10 de Madrid. LA MEJORA DEL ONCE (el dueno: «2 dias
      #   que habia jugadores para mejorar el XI y Pepe no ha hecho
      #   nada»). Paso propio tras el panel, en cada vuelta: la
      #   combinacion de cambios (misma posicion, hasta 3) que mas puntos
      #   esperados suma, con deuda hasta -1 M a 64 h o mas de la jornada;
      #   en rojo desde 88 h, cambia caro por barato antes que jugar con 0.
      #   El que sale solo se vende con el relevo dentro. Verja 202/202;
      #   paso 0 con 40; ensayo #38247206025 verde (NADA_QUE_HACER: la
      #   caja de la J9 ya va en -6,1 M con Ivan, Gerard y Moi).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_LA_MEJORA_DEL_ONCE: "1"

      # Encendido 13/10 de Madrid. EL CALENDARIO EN LA MEJORA DEL ONCE (el
      #   dueno, 12/10: «antes de la jornada se mira el calendario… mejor
      #   jugadores de los equipos de arriba»). La mejora valora cada cambio
      #   con el xP de las 3 proximas jornadas PRINCIPALES (sin aplazados):
      #   casa 1,06 / fuera 0,94, rival del top 6 0,90 / resto 1,04 (lab,
      #   n=564) y encoge a los de pocos partidos hacia su tramo. Nunca vende
      #   a uno 0,5 pts mejor por calendario; en rojo financia igual que sin
      #   el. Verja 208/208; paso 0 con 44; ensayos #38275852357,
      #   #38290081550 y #38358298552 verdes (NADA_QUE_HACER, 1 frenado).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_EL_CALENDARIO_EN_LA_MEJORA: "1"

      # Encendido 13/10 noche de Madrid. EL CIERRE DE LA JORNADA (el dueno,
      #   12/10: «antes del inicio de jornada se mira el calendario, se
      #   decide el mejor XI y se vende a los que falten para estar en
      #   positivo»). Paso propio DESPUES de la mejora. Desde 64 h antes de
      #   la ronda elige el mejor once con el calendario y, si la caja al
      #   empezar la ronda no llega a 0, vende a los que sobran (nunca a un
      #   titular del once escrito, ni a Yamal, ni a protegidos); publica a
      #   los vendibles para que llegue la oferta del Computer; a <40 h
      #   retira pujas de la ronda/chollos que no se podrian pagar. Si el
      #   banquillo no llega, dice FALTA (lo arregla la mejora). Verja
      #   208/208; paso 0 con 44; ensayos #38275852357, #38290081550 y
      #   #38454935628 verdes (FUERA_DE_LA_VENTANA a 71,5 h).
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_EL_CIERRE_DE_LA_JORNADA: "1"

      # Encendido 29/09 de Madrid. LA REVISION DE LAS PUJAS VIVAS.
      #
      #   En la ventana del reset retira nuestras pujas por jugadores que
      #   Biwenger ya marca lesionados, en duda o sancionados (caso
      #   Zubeldia, laboratorio E6). No toca las de la orden del gestor.
      #   Verja 197/197; paso 0; ensayo #36602358126 verde.
      #   Si la vuelta siguiente sale roja, se quita esta linea y ya.
      BORDALAS_REVISA_LAS_PUJAS_VIVAS: "1"

      # Encendido 29/09 22:20 de Madrid. LA REJA CON TOLERANCIA.
      #
      #   Biwenger reemite en el tablon los bloques de ventas al Computer
      #   con fecha nueva (Lunin, 420.200, el 18/09 a las 06:53 y 07:03).
      #   Sin tolerancia se contaban dos veces: la caja de Pepe salia
      #   420.200 de mas y la de los rivales no valia (MUERTO). Con ella:
      #   418/438 lecturas del saldo cuadran al euro (las 20 restantes son
      #   lecturas en mitad del reset, cuadran en la siguiente); Luismi
      #   baja 13,3 M. Verja 198/198 con el; paso 0 con 37; ensayo
      #   #36624537781 verde. Si la vuelta siguiente sale roja, se quita.
      BORDALAS_REJA_CON_TOLERANCIA: "1"

      # Encendido 24/09. EL ONCE SE BUSCA UNA VEZ, NO NOVECIENTAS.
      #
      #   NO CAMBIA NINGUNA DECISION. Es memoria, no criterio: recuerda la
      #   respuesta de la busqueda del once segun el contenido exacto de lo
      #   que recibe. LA BUSQUEDA EN SI NO SE TOCA.
      #
      #   EL PROBLEMA. La vuelta paso de 27 min (22/09) a 78 (24/09), y dos
      #   murieron en el tope de 75. Medido por el propio ciclo:
      #       1070,75 s   73,8 %   build_global_decision
      #        244,75 s   16,9 %   build_competitive_observer
      #        125,35 s    8,6 %   build_cycle_acquisition_board
      #   Y ese analisis se hace DOS veces (PRE y POST): 18m38s cada uno.
      #
      #   LA CAUSA, medida: `build_lineup` es el 97,8 % de
      #   `build_global_decision`. Se llama 135 VECES por vuelta, y de 963
      #   busquedas del once SOLO 48 SON DISTINTAS. Cada motor -plazo,
      #   solvencia, ventas, liquidez, ofertas- se montaba el once por su
      #   cuenta sin pasarselo a nadie. Y escala con la plantilla: 0,26 s
      #   con 15 fichas, 4,78 s con 21.
      #
      #   LO QUE COSTABA NO ARREGLARLO: con la vuelta a 78 min y el cron
      #   cada hora, GitHub solo guarda UN disparo en cola, asi que se
      #   perdia ~1 latido de cada 4. El 24/09 caducaban 8 publicaciones en
      #   35 min y Pepe solo llega a renovar UNA por vuelta.
      #
      #   RESULTADO EN PRODUCCION (25/09), que supero a la estimacion:
      #       el analisis        1451,53 s  ->  90,41 s   (16 veces mas rapido)
      #       la vuelta entera        78 min  ->  7 min
      #       El once, una vez: 70 busquedas hechas, 847 recordadas,
      #                         0 SIN CLAVE
      #       el XI impreso: LOS MISMOS ONCE que la vuelta anterior, 3-5-2
      #   (La estimacion previa era ~21 min, hecha en laboratorio con una
      #   plantilla de 19 y n=1 por lado. Se quedo corta.)
      #
      #   Verja 184/184 en verde con los interruptores de produccion
      #   puestos. Paso 0 PASADO con los 30. La guardia
      #   `test_el_once_se_busca_una_vez_v1` tiene 10 pruebas y se la vio
      #   ponerse roja rompiendo el modulo de dos maneras distintas.
      #
      #   LO QUE HAY QUE SEGUIR VIGILANDO: la memoria recuerda POR EL
      #   CONTENIDO DE LO QUE RECIBE. Si dos onces distintos dieran la misma
      #   clave, la respuesta seria erronea EN SILENCIO. El aviso es
      #   `0 sin clave` y que el XI impreso no cambie sin motivo.
      BORDALAS_EL_ONCE_UNA_VEZ: "1"

      # Encendido 25/09. EL DEFICIT SE MIDE CONTRA EL PLAZO, NO CONTRA HOY.
      #
      #   LO QUE PASABA. Desde el arreglo del 23/09 el ciclo SABE la fecha y
      #   la imprime, pero la regla que decide no la usaba:
      #
      #     "El reloj de solvencia dice «PUBLICAR» con 7.005.920 EUR de
      #      deficit. No se puja: el plazo, del calendario, es el 09/10 a
      #      las 14:45: quedan 336 h (14,0 dias). Hay tiempo, PERO LA REGLA
      #      DE HOY CIERRA CON CUALQUIER DEFICIT."
      #
      #   O sea: sabia que le quedaban dos semanas y actuaba como si fuera
      #   esta tarde. Con el interruptor, el deficit solo frena a menos de
      #   24 h del plazo.
      #
      #   POR QUE AHORA. Entre la jornada 7 (18/09) y la 8 (09/10) hay 21
      #   dias por el paron de selecciones. Comprobado en las DOS fuentes,
      #   que coinciden al minuto:
      #       nuestro calendario (MARCA+LALIGA)  J8 -> 09/10/2026 21:00
      #       el calendario de Biwenger          J8 -> 9 oct 21:00
      #   El plazo efectivo es el 09/10 a las 14:45 (T-6 h 15 min). El
      #   margen NO se toca: solo cambia si se mira o no.
      #
      #   PASO 0 HECHO: este interruptor ya estaba en los 29 del paso 0 del
      #   23/09 y en los 30 del 24/09, los dos en verde.
      #
      #   LO QUE SE ESPERA, Y LO QUE NO ESTA COMPROBADO:
      #     - SI: desbloquea la subasta, que hoy dice `blocked_by: SOLVENCIA`
      #       con 14 dias por delante.
      #     - NO COMPROBADO: si ademas libera la reserva de solvencia sobre
      #       jugadores concretos. Hoy Ceballos -comprado como apuesta de
      #       revalorizacion- sale con `Reserved solvencia: SI`, o sea
      #       marcado para venderse y tapar el agujero que abrio comprarlo.
      #       QUE ESO SE ARREGLE ES UNA INFERENCIA, NO UN DATO. Mirarlo en
      #       la vuelta siguiente.
      #     - Y ojo: encenderlo NO garantiza que puje. Con el saldo en
      #       -7.005.920 y dos pujas del dueno vivas, la puja maxima son
      #       2.208.580.
      BORDALAS_SOLVENCIA_POR_SU_PLAZO: "1"

      # Encendido 25/09. EL QUE SE QUEDA COBRA EN LA MONEDA DE LA LIGA.
      #
      #   NO CAMBIA LA FORMULA: cambia UN factor. En `xi_upgrade_value` el
      #   punto se pagaba a la tarifa del MERCADO (mediana de precio/puntos
      #   del catalogo, ~21.500 EUR). Para quien te quedas, un punto vale lo
      #   que PAGA LA LIGA: 30.000 EUR, de `caja_de_la_liga`, cuadrado al euro
      #   sobre 24 dias. Margen, confianza, vetos del once y suelo de
      #   titularidad no se tocan.
      #
      #   SOLO LAS DOS VIAS DE PLANTILLA: mejora del once y ficha vacia. La
      #   reventa al Computer, especular y tener siguen en la del mercado
      #   (guardia `test_el_que_se_revende_paga_la_del_mercado`).
      #
      #   MEDIDO, reconstruyendo las fotos con las funciones de produccion
      #   (sin la moneda la reconstruccion da la decision publicada en 20/20,
      #   20/20 y 19/20):
      #       18/09   pasan 2 -> 3   Dmitrovic pasa; Maffeo y Cabrera siguen
      #       23/09   pasan 0 -> 2   Thiago Fernandez, Oriol Rey
      #       25/09   pasan 0 -> 0   Lejeune y Antonio Blanco: SUPERA_PRESUPUESTO
      #   Entre 0 y 3 al dia, n=60 candidatos en 3 fotos. El liston sigue
      #   frenando: pasan el precio 7 de 15 con via de plantilla.
      #   Rescata 3 de los 7 NO_COMPENSA del censo y 0 de los 10
      #   RENDIMIENTO_INSUFICIENTE (esos van por reventa o tener: no es su via).
      #
      #   LO QUE ESTO NO ARREGLA, Y CONVIENE NO CONFUNDIRLO: el censo del
      #   25/09 midio que la via de reventa al Computer vale ~1,8 % contra un
      #   liston del 3 %, o sea que NO PUEDE PASAR NUNCA, y es la mejor via de
      #   47 de 60 candidatos. ESO SIGUE IGUAL. Esta moneda es otra cosa, mas
      #   pequeña y tambien real.
      #
      #   Paso 0 PASADO el 25/09 con los 30, este incluido, y los cuatro de
      #   produccion puestos.
      #
      #   LO QUE NO ESTA MEDIDO Y HAY QUE VIGILAR:
      #     - Tambien sube CUANTO se paga, no solo quien pasa: Cabrera
      #       3.133.329 -> 3.214.496 (+81.167) el 18/09.
      #     - La LISTA DE LA NOCHE del panel usa el bolsillo de la via de HOY,
      #       no el de la via que gana con la moneda: el 25/09 decia 3.674.989
      #       por Lejeune y la decision real era SUPERA_PRESUPUESTO. Hasta que
      #       se arregle, NO DICE LO QUE VA A PASAR.
      #     - Llega tambien a BUY V10 (build_controlled_run -> market_trader_shadow
      #       -> calculate_intelligent_bids -> value_candidate), que es un
      #       camino de ESPECULAR: puede subir su authority_bid, acotado por
      #       max_rational. Dormido desde el 04/09. Si vuelve a pujar, mirar
      #       si la puja sale de un suggested_bid de plantilla.
      #     - Si pasan mas de 3-4 al dia, el liston se ha quedado sin funcion:
      #       mirar el EUR/punto que piden los que pasan.
      BORDALAS_LA_MONEDA_DE_LA_LIGA: "1"

      # QUITADO 22/09 — BORDALAS_SIN_SUBASTA
      #
      #   Estuvo puesto desde la noche del 21/09 como apagado PROVISIONAL,
      #   para que el reset de las 07:00 no comprase otros cinco suplentes
      #   mientras no hubiera filtro. Ya hay filtro: el de arriba.
      #
      #   Y para que conste, porque su mensaje enganaba: este interruptor
      #   NO cerraba la puerta de fichar. Solo cerraba `plan_del_reset`,
      #   cuyo unico modo es la cesta de reventa. El tablero de fichajes y
      #   el carril siguieron pujando todo el tiempo.
      #
      #   EL CODIGO SIGUE VIVO en `la_subasta.py` (1469, 1477, 1587) y ahi
      #   se queda: es el freno de mano. Lo que se quito fue esta linea.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot
          mkdir -p data/lineup_monitor
          mkdir -p data/intelligence
          mkdir -p data/calendar
          mkdir -p data/rival_intelligence
          mkdir -p data/league_center
          mkdir -p data/competitive_negotiations
          mkdir -p data/trading
          mkdir -p dashboard/data

      - name: Restore Bordalas state
        uses: actions/cache@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/league_center
            data/competitive_negotiations
            data/trading
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BIWENGER_USERNAME" || (echo "Falta BIWENGER_USERNAME" && exit 1)
          test -n "$BIWENGER_PASSWORD" || (echo "Falta BIWENGER_PASSWORD" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Falta API_FOOTBALL_KEY" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate optimized production cycle
        shell: bash
        run: |
          # LA LISTA VIVE EN UN SOLO SITIO (07/09/2026)
          #
          # Aqui habia 66 lineas escritas a mano, una por guardia,
          # y el script de la puerta las leia de este fichero. Cada
          # guardia nueva habia que acordarse de ponerla en los dos
          # sitios, y el dia que se olvidase, CI habria corrido
          # menos que el dueño en local SIN AVISAR DE NADA.
          #
          # Ahora la lista esta en `scripts/run_validation_gate.py`
          # y aqui solo se le llama. El script devuelve != 0 si
          # falla cualquiera, asi que este paso sigue parando el
          # ciclo exactamente igual que antes.
          python scripts/run_validation_gate.py

      - name: Run Bordalas V10 PRODUCTION
        shell: bash
        run: |
          python -m src.v10_full_autonomous_live

      - name: Build Sala de Operaciones telemetry
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard

          echo ""
          echo "========================================"
          echo " BORDALAS IA - DASHBOARD GENERATED"
          echo "========================================"

          test -f data/trading/v10_full_autonomous_status.json
          test -f dashboard/data/status.json
          ls -lh data/trading/v10_full_autonomous_status.json
          ls -lh dashboard/data/status.json

      # LA MEJORA DEL ONCE (12/10/2026). Despues del panel, que es quien
      #   sabe la titularidad. APAGADA: `BORDALAS_LA_MEJORA_DEL_ONCE`.
      #   Nunca rompe la vuelta. Deja lo que hizo en
      #   data/trading/la_mejora_vuelta.json para el cierre.
      - name: La mejora del once
        shell: bash
        run: |
          python -m src.actions.la_mejora_del_once || true

      # EL CIERRE DE LA JORNADA (12/10/2026). DESPUES de la mejora (13/10:
      #   antes contaba como vivas las pujas que la mejora perdio en el
      #   reset y no veia lo que la mejora cobraba): decide el mejor once
      #   de la proxima ronda y vende lo que sobre hasta >= 0.
      #   APAGADO: `BORDALAS_EL_CIERRE_DE_LA_JORNADA`. Nunca rompe la vuelta.
      - name: El cierre de la jornada
        shell: bash
        run: |
          python -m src.actions.el_cierre_de_la_jornada || true
      # EL PARTE VENDE (17/10/2026, paso 4 del laboratorio). DESPUES del
      #   cierre: vende al suplente en duda, lesionado o sancionado desde el
      #   95 % de su valor (lo publica si no lo esta); nunca uno del once
      #   escrito, ni con la ronda jugandose. APAGADO:
      #   `BORDALAS_EL_PARTE_VENDE`. Nunca rompe la vuelta.
      - name: El parte vende
        shell: bash
        run: |
          python -m src.actions.el_parte_vende || true
      # LA ROTACION (17/10/2026, laboratorio de la rotacion). DESPUES del
      #   parte: cambia al que lleva 2 dias sin subir por uno de su posicion
      #   que sube y puntua igual o mas (2 por ventana y por semana, con la
      #   caja de todos los motores); vende al que sale cuando el otro ya
      #   llego, sin dejar hueco en el once ni con la ronda jugandose.
      #   APAGADA: `BORDALAS_LA_ROTACION`. Nunca rompe la vuelta.
      - name: La rotacion
        shell: bash
        run: |
          python -m src.actions.la_rotacion 2>&1 | tee data/trading/la_rotacion_vuelta.txt || true
      # EL INFORME DE LA MAÑANA (18/10/2026, laboratorio del 18/10). DESPUES
      #   de la rotacion y ANTES de guardar los libros: una vez por dia de
      #   mercado, tras el reset, pone a cada nuevo del mercado (Computer y
      #   managers) dos notas, SUBE y PUNTUA, con los pesos medidos, y lo
      #   apunta en su libro. Lee una pagina de FF por equipo para las
      #   noticias. SOLO OBSERVA: no puja ni vende. APAGADO:
      #   `BORDALAS_EL_INFORME_DE_LA_MANANA`. Nunca rompe la vuelta: el
      #   modulo tiene un tope de reloj de 2 min para FF (tambien dentro de
      #   cada descarga), y el paso, 4 min y `continue-on-error` por si acaso,
      #   para que un FF que gotea no se coma la vuelta ni salte el panel.
      - name: El informe de la manana
        shell: bash
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python -m src.intelligence.el_informe_de_la_manana || true
      - name: Update Cloudflare dashboard
        shell: bash
        run: |
          npx --yes wrangler@4.120.1 kv key put \
            "status.json" \
            --path "dashboard/data/status.json" \
            --namespace-id "dbb7542f31b34d8ab0590bf774538b21" \
            --remote

          echo ""
          echo "========================================"
          echo " BORDALAS IA - CLOUDFLARE KV UPDATED"
          echo "========================================"

      # GUARDAR VA ANTES DE PODAR (22/09/2026)
      #
      #   Estos dos pasos estaban al reves, y la consecuencia estaba
      #   escrita en `src/estado/los_libros.py:451`: como se podaba
      #   ANTES de guardar, cualquier libro que quisieramos commitear
      #   se habria guardado YA RECORTADO. Por eso el registro de la
      #   vuelta (`autopilot_log.jsonl`) nunca pudo ir a git, y por eso
      #   hemos tenido que RECONSTRUIR vueltas en vez de leerlas.
      #
      #   Invertidos, se guarda lo que la vuelta escribio y se poda
      #   despues. El cache lo guarda el paso `post` al final del job,
      #   asi que la poda sigue haciendo su trabajo y no se cachea de
      #   mas: solo cambia QUE se commitea.
      #
      #   Esto por si solo no mete el registro en git — hace falta el
      #   cambio de codigo que lo anada a los libros guardados. Lo que
      #   hace es QUITAR EL MOTIVO por el que no se podia.
      - name: Guardar los libros
        if: always()
        shell: bash
        run: |
          git config user.name  "bordalas-ciclo"
          git config user.email "ciclo@bordalas.local"
          python scripts/guardar_los_libros.py --empujar

      - name: Prune persisted state
        if: always()
        shell: bash
        run: |
          python scripts/prune_github_state.py

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-live-diagnostics-${{ github.run_id }}
          path: |
            data/autopilot/autopilot_log.jsonl
            data/lineup_monitor/state.json
            data/calendar/laliga_calendar.json
            data/calendar/calendar_changes.jsonl
            data/intelligence/jornada_perfecta_lineups.json
            data/rival_intelligence/rival_intelligence.json
            data/competitive_negotiations/state.json
            data/trading/position_ledger.json
            data/trading/counteroffer_repricing_state.json
            data/trading/v10_production_status.json
            data/trading/v10_full_autonomous_status.json
            data/trading/la_rotacion.json
            data/trading/la_rotacion.jsonl
            data/trading/la_rotacion_vuelta.txt
            data/trading/la_ronda.json
            data/trading/el_cierre.json
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 2
