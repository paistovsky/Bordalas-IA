name: Bordalas IA Live

on:
  workflow_dispatch:

  schedule:
    # Respaldo interno de GitHub.
    # El cron-job externo despierta a Pepe cada 15 minutos.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bordalas-autopilot
  cancel-in-progress: false

jobs:
  live:
    name: Bordalas live controlled cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot
          mkdir -p data/lineup_monitor
          mkdir -p data/intelligence
          mkdir -p data/calendar
          mkdir -p data/rival_intelligence
          mkdir -p dashboard/data

      - name: Restore Bordalas state
        uses: actions/cache@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BIWENGER_USERNAME" || (echo "Falta BIWENGER_USERNAME" && exit 1)
          test -n "$BIWENGER_PASSWORD" || (echo "Falta BIWENGER_PASSWORD" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Falta API_FOOTBALL_KEY" && exit 1)

      - name: Run Bordalas LIVE
        shell: bash
        run: |
          python -m src.autopilot --once --live

      - name: Build Sala de Operaciones telemetry
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard

          echo ""
          echo "========================================"
          echo " BORDALAS IA - DASHBOARD GENERATED"
          echo "========================================"

          test -f dashboard/data/status.json
          ls -lh dashboard/data/status.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Sala de Operaciones
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Prune persisted state
        if: always()
        shell: bash
        run: |
          python scripts/prune_github_state.py

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-live-diagnostics-${{ github.run_id }}
          path: |
            data/autopilot/autopilot_log.jsonl
            data/lineup_monitor/state.json
            data/calendar/laliga_calendar.json
            data/calendar/calendar_changes.jsonl
            data/intelligence/jornada_perfecta_lineups.json
            data/rival_intelligence/rival_intelligence.json
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 2

  deploy-dashboard:
    name: Deploy Sala de Operaciones
    needs: live
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4