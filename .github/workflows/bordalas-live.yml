name: Bordalas IA Live

# EL SCHEDULE DE GITHUB SE RETIRO EL 12/09/2026
#
#   Y NO POR SIMPLIFICAR: SE SALTABA VUELTAS TODOS LOS DIAS.
#
#       llegaba 30-40 minutos tarde
#       y perdia ciclos enteros
#
#   Los `schedule` de Actions no son una promesa: son una cola de
#   baja prioridad. Con una vuelta por hora, 30-40 minutos tarde
#   no es "un poco tarde" — es que la vuelta de esa hora se
#   solapa con la siguiente o se pierde.
#
#   Si abres este fichero, ves que solo tiene `workflow_dispatch`
#   y piensas "le falta el cron": esto es lo que te falta saber.
#   Se probo, se midio y se quito. QUE NADIE LO VUELVA A PONER
#   SIN SABER POR QUE SE QUITO.
#
#   El latido lo dispara ahora cron-job.org (hora de Madrid), que
#   entra por `workflow_dispatch`:
#
#       :07 cada hora, horas 0-3 y 8-23   latido
#       04:45 y 04:50                     ventana del reset
#       07:15                             tras el reset
#
#   ESO NO SE CONFIGURA AQUI Y EL CODIGO NO PUEDE LEERLO. Lo que
#   el proyecto declara esperar esta en `config/disparos.json`, y
#   lo unico que compara esa declaracion contra la realidad es el
#   aviso de DISPARO FUERA DE HORA de la pantalla. Ver
#   `src/analysis/los_disparos.py`.
#
#   Guardia: `test_el_schedule_de_github_no_vuelve_sin_saber_por_que`.
on:
 workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bordalas-autopilot
  cancel-in-progress: false

jobs:
  live:
    name: Bordalas live controlled cycle
    runs-on: ubuntu-latest

    # EL TOPE NO ES PARA QUE QUEPA UNA VUELTA LENTA (21/09/2026)
    #
    #   Es para que una vuelta COLGADA no se coma el dia. Con
    #   `cancel-in-progress: false`, un job atascado bloquea el
    #   grupo de concurrencia: los disparos siguientes se quedan
    #   en cola y GitHub solo guarda UNO pendiente. Un tope de 600
    #   minutos significa que un cuelgue a las 02:00 se lleva por
    #   delante el reset, la ventana y el dia entero.
    #
    #   75 es TEMPORAL. El 22/09, tras sacar la guardia cara de la
    #   verja, una vuelta tarda 27 min:
    #       verja       6m 24s
    #       ciclo      15m 09s
    #       dashboard   5m 04s
    #
    #   Los dos ultimos son el TAMANO DE LA PLANTILLA: `build_lineup`
    #   es el 94-95 % de los dos, y va 0,26 s con 15 fichas y 4,78 s
    #   con 21. Cuando la plantilla vuelva a 16, ESTE NUMERO BAJA A 35.
    timeout-minutes: 75

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BORDALAS_BID_SALT: ${{ secrets.BORDALAS_BID_SALT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # INTERRUPTORES ENCENDIDOS
      #
      #   Un interruptor encendido aqui ES ESTADO DE PRODUCCION: la verja
      #   corre dentro de este mismo job y lo ve. El 20/09 se encendio uno
      #   sin comprobarlo antes, quince guardias se pusieron rojas y el
      #   ciclo NO LLEGO A CORRER. Doctrina 104.
      #
      #   ANTES DE ANADIR UNO AQUI, EL PASO 0:
      #     python scripts/run_validation_gate.py --paso-0
      #   Si no da el mismo verde que sin el, NO SE ENCIENDE.
      #   Ver `src/analysis/el_protocolo_de_encendido.py`.
      #
      #   El 22/09 el paso 0 evito el segundo ciclo parado de la semana:
      #   `BORDALAS_REVENTA_SOLO_SI_JUEGA` tumbaba dos guardias y se vio
      #   ANTES de tocar este fichero.

      # Encendido 21/09. El marcador ordena las jornadas por la fecha real
      # del tablon, no por el numero de jornada del calendario: "Jornada 6" y
      # "Jornada 6 (aplazada)" compartian hora, el desempate era el round_id,
      # y dos jornadas se restaban contra una foto POSTERIOR.
      # Medido: medibles 4->5, diferencia_media +20,4 -> +3,6, restas con
      # negativos grandes 2->0, cero peticiones nuevas, ninguna decision
      # cambia. Solo toca el marcador: no puede cambiar una compra ni una puja.
      BORDALAS_JORNADAS_POR_SU_FECHA: "1"

      # Encendido 22/09. NO SE COMPRA PARA REVENDER A QUIEN NO CONSTA QUE
      # VAYA A JUGAR.
      #
      #   No inventa umbral: llama a `roster_fill_veto`, que ya contestaba
      #   esa pregunta para la via de plantilla y a la reventa nunca se le
      #   aplico (doctrina 84). Su corte del 40 % tiene medicion: acierta el
      #   81 %, n=114.
      #
      #   POR QUE, medido sobre los 91 viajes cerrados de Pollo17 y Luismi:
      #       puntuo 2-4 pts/partido   n=25   100 % en verde   ROI + 4,67 %
      #       puntuo 4-6 pts/partido   n=12   100 % en verde   ROI +12,56 %
      #       HABIA PARTIDO Y NO JUGO  n= 6    33 % en verde   ROI - 2,03 %
      #                                       el mercado se movio +0,00 %
      #
      #   Contrafactual sobre nuestra temporada: para 12 de nuestros 24
      #   viajes, que perdieron 475.115 EUR. El resultado pasa de +92.375 a
      #   +567.490. Y para las seis compras del 21/09 (2.566.406 EUR).
      #
      #   Paso 0 hecho: verja 172/172 con el interruptor y sin el, y el
      #   paso 0 con los 22 puestos en verde. Ver `config/paso_0.json`.
      BORDALAS_REVENTA_SOLO_SI_JUEGA: "1"

      # QUITADO 22/09 — BORDALAS_SIN_SUBASTA
      #
      #   Estuvo puesto desde la noche del 21/09 como apagado PROVISIONAL,
      #   para que el reset de las 07:00 no comprase otros cinco suplentes
      #   mientras no hubiera filtro. Ya hay filtro: el de arriba.
      #
      #   Se quita ahora y no despues por una razon de orden: hoy la caja
      #   esta en -580.106 y `plan_del_reset` exige deficit cero, asi que la
      #   subasta queda REABIERTA PERO DORMIDA. Se abre la puerta mientras
      #   otro cerrojo la sujeta, en vez de abrirla el dia que ademas hay
      #   dinero encima de la mesa.
      #
      #   Y para que conste, porque su mensaje enganaba: este interruptor
      #   NO cerraba la puerta de fichar. Solo cerraba `plan_del_reset`,
      #   cuyo unico modo es la cesta de reventa. El tablero de fichajes y
      #   el carril siguieron pujando todo el tiempo.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare persistent directories
        shell: bash
        run: |
          mkdir -p data/autopilot
          mkdir -p data/lineup_monitor
          mkdir -p data/intelligence
          mkdir -p data/calendar
          mkdir -p data/rival_intelligence
          mkdir -p data/league_center
          mkdir -p data/competitive_negotiations
          mkdir -p data/trading
          mkdir -p dashboard/data

      - name: Restore Bordalas state
        uses: actions/cache@v4
        with:
          path: |
            data/autopilot
            data/lineup_monitor
            data/intelligence
            data/calendar
            data/rival_intelligence
            data/league_center
            data/competitive_negotiations
            data/trading
            data/external_status_cache.json
            data/player_mapping_cache.json
            data/snapshot_*.json
          key: bordalas-state-${{ github.run_id }}
          restore-keys: |
            bordalas-state-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BIWENGER_USERNAME" || (echo "Falta BIWENGER_USERNAME" && exit 1)
          test -n "$BIWENGER_PASSWORD" || (echo "Falta BIWENGER_PASSWORD" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Falta API_FOOTBALL_KEY" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate optimized production cycle
        shell: bash
        run: |
          # LA LISTA VIVE EN UN SOLO SITIO (07/09/2026)
          #
          # Aqui habia 66 lineas escritas a mano, una por guardia,
          # y el script de la puerta las leia de este fichero. Cada
          # guardia nueva habia que acordarse de ponerla en los dos
          # sitios, y el dia que se olvidase, CI habria corrido
          # menos que el dueño en local SIN AVISAR DE NADA.
          #
          # Ahora la lista esta en `scripts/run_validation_gate.py`
          # y aqui solo se le llama. El script devuelve != 0 si
          # falla cualquiera, asi que este paso sigue parando el
          # ciclo exactamente igual que antes.
          python scripts/run_validation_gate.py

      - name: Run Bordalas V10 PRODUCTION
        shell: bash
        run: |
          python -m src.v10_full_autonomous_live

      - name: Build Sala de Operaciones telemetry
        shell: bash
        run: |
          python -m src.telemetry.build_dashboard

          echo ""
          echo "========================================"
          echo " BORDALAS IA - DASHBOARD GENERATED"
          echo "========================================"

          test -f data/trading/v10_full_autonomous_status.json
          test -f dashboard/data/status.json
          ls -lh data/trading/v10_full_autonomous_status.json
          ls -lh dashboard/data/status.json
      - name: Update Cloudflare dashboard
        shell: bash
        run: |
          npx --yes wrangler@4.120.1 kv key put \
            "status.json" \
            --path "dashboard/data/status.json" \
            --namespace-id "dbb7542f31b34d8ab0590bf774538b21" \
            --remote

          echo ""
          echo "========================================"
          echo " BORDALAS IA - CLOUDFLARE KV UPDATED"
          echo "========================================"
      - name: Prune persisted state
        if: always()
        shell: bash
        run: |
          python scripts/prune_github_state.py

      - name: Guardar los libros
        if: always()
        shell: bash
        run: |
          git config user.name  "bordalas-ciclo"
          git config user.email "ciclo@bordalas.local"
          python scripts/guardar_los_libros.py --empujar

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bordalas-live-diagnostics-${{ github.run_id }}
          path: |
            data/autopilot/autopilot_log.jsonl
            data/lineup_monitor/state.json
            data/calendar/laliga_calendar.json
            data/calendar/calendar_changes.jsonl
            data/intelligence/jornada_perfecta_lineups.json
            data/rival_intelligence/rival_intelligence.json
            data/competitive_negotiations/state.json
            data/trading/position_ledger.json
            data/trading/counteroffer_repricing_state.json
            data/trading/v10_production_status.json
            data/trading/v10_full_autonomous_status.json
            dashboard/data/status.json
          if-no-files-found: ignore
          retention-days: 2
